<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Diesel GLB — Character Test</title>
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#0b1118;color:#f4f7fb}
*{box-sizing:border-box}body{margin:0}header{padding:16px 18px;background:#111b26;border-bottom:1px solid #263544}h1{font-size:18px;margin:0 0 5px}p{margin:0;color:#9eafc0;font-size:13px}#stage{height:68vh;min-height:380px;position:relative}canvas{display:block;width:100%;height:100%}.hud{padding:14px 18px;display:grid;gap:8px}.badge{padding:10px 12px;border:1px solid #293847;border-radius:10px;background:#111b26;font-size:13px;overflow-wrap:anywhere}.ok{color:#77e0ac}.warn{color:#ffd27a}.err{color:#ff8996}button{border:0;border-radius:9px;padding:10px 13px;font-weight:700;background:#eaf3fb;color:#10202d}small{color:#9eafc0}
</style>
</head>
<body>
<header><h1>Diesel character — model inspection</h1><p>Standalone test only. This does not change the live game.</p></header>
<div id="stage"></div>
<section class="hud">
<div id="load" class="badge">Loading Diesel.glb…</div>
<div id="details" class="badge">Checking mesh, materials, skeleton and animations.</div>
<div><button id="spin" type="button">Pause rotation</button> <button id="reset" type="button">Reset view</button></div>
<small>If this page is opened directly from GitHub, the repository's Pages hosting must be enabled for the preview to run as a webpage.</small>
</section>
<script type="module">
import * as THREE from 'https://esm.sh/three@0.170.0';
import {GLTFLoader} from 'https://esm.sh/three@0.170.0/examples/jsm/loaders/GLTFLoader.js';
const stage=document.querySelector('#stage'),load=document.querySelector('#load'),details=document.querySelector('#details');
const scene=new THREE.Scene();scene.background=new THREE.Color(0x111923);
const camera=new THREE.PerspectiveCamera(42,1,.01,1000);camera.position.set(3,2.2,5);
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:false});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1;stage.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xdcecff,0x352b24,2.1));
const key=new THREE.DirectionalLight(0xffe1bd,3);key.position.set(3,6,4);scene.add(key);
const fill=new THREE.DirectionalLight(0x8bbdff,1.2);fill.position.set(-4,2,-3);scene.add(fill);
const floor=new THREE.GridHelper(10,20,0x486174,0x263746);floor.position.y=-.01;scene.add(floor);
let model=null,mixer=null,rotating=true,clock=new THREE.Clock();
function resize(){const w=stage.clientWidth,h=stage.clientHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix()}new ResizeObserver(resize).observe(stage);resize();
new GLTFLoader().load('./Diesel.glb',g=>{
 model=g.scene;scene.add(model);
 const box=new THREE.Box3().setFromObject(model),size=box.getSize(new THREE.Vector3()),center=box.getCenter(new THREE.Vector3());
 model.position.sub(center);const max=Math.max(size.x,size.y,size.z)||1;model.scale.setScalar(2.2/max);
 camera.position.set(0,Math.max(1.3,size.y*.35),Math.max(3,size.y*1.7));camera.lookAt(0,0,0);
 const meshes=[],materials=new Set(),skinned=[];model.traverse(o=>{if(o.isMesh){meshes.push(o);for(const m of (Array.isArray(o.material)?o.material:[o.material]))if(m)materials.add(m)}if(o.isSkinnedMesh)skinned.push(o)});
 const clips=g.animations||[];if(clips.length){mixer=new THREE.AnimationMixer(model);mixer.clipAction(clips[0]).play()}
 load.innerHTML='<span class="ok">Loaded successfully</span> — '+meshes.length+' mesh(es)';
 details.textContent='Dimensions (source units): '+size.x.toFixed(2)+' × '+size.y.toFixed(2)+' × '+size.z.toFixed(2)+' | Materials: '+materials.size+' | Skinned meshes: '+skinned.length+' | Bones: '+new Set(skinned.flatMap(m=>m.skeleton.bones)).size+' | Animations: '+clips.length+(clips.length?' ('+clips.map(c=>c.name||'unnamed').join(', ')+')':'');
 if(!skinned.length)details.innerHTML+='<br><span class="warn">No skinned mesh detected: character may need rigging before animated gameplay.</span>';
 if(!clips.length)details.innerHTML+='<br><span class="warn">No animation clips embedded. A rig may still be present; movement animations would need to be added.</span>';
},undefined,e=>{load.innerHTML='<span class="err">Could not load model.</span> '+(e?.message||'Check that Diesel.glb is in the same folder and this page is served over HTTP/HTTPS.');details.textContent='The browser did not complete GLB loading; this is not yet proof that the model file is broken.'});
document.querySelector('#spin').onclick=e=>{rotating=!rotating;e.currentTarget.textContent=rotating?'Pause rotation':'Resume rotation'};
document.querySelector('#reset').onclick=()=>{camera.position.set(0,2,5);camera.lookAt(0,0,0);if(model)model.rotation.y=0};
function animate(){requestAnimationFrame(animate);const dt=clock.getDelta();if(mixer)mixer.update(dt);if(model&&rotating)model.rotation.y+=dt*.35;renderer.render(scene,camera)}animate();
</script>
</body></html>
